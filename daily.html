<!DOCTYPE html>
<html>

<head>
    <title>Application Form</title>
    <link rel="stylesheet" href="daily.css">
    <link rel="icon" type="image/png" href="css/logo1.png">
</head>

<body>
   <div class="logo">
     <img src="css/logo1.png" height="100px" class="center"></div>
    <h1 > Daily Pass Form</h1>
    <div class="main"><form action="/daily/" method="POST" class="form">
      {% csrf_token %}
    

        <label for="gender" class="required">Gender:</label>
        <select name="gender" id="gender" required>
          <option value="Female">Female</option>
          <option value="Male">Male</option>
          <option value="Other">Other</option>
        </select>
        <br>
      
        <label for="aadhar" class="required">Aadhar No. (Last 4 digits):</label>
        <input type="number" id="aadhar" name="aadhar" placeholder="Last 4 digits" min="0000" max="9999" required>
        <br>
      
        <label for="dateTime" class="required">Select Date and Time:</label>
        <input type="datetime-local" id="dateTime" name="dateTime" required>
      

        <br>
      
        <input type="submit" value="Submit">
      
      </form>
      
      
    </div>
</body>

</html>
